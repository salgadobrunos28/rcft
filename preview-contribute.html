<!doctype html>
<html lang="en" data-ui="sheet">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Contribute | Relational Cartography (rcft)</title>
  <meta name="robots" content="noindex">
  <meta name="description" content="Contribute a response to Relational Cartography: what does the word border mean to you?">
  <meta name="theme-color" content="#0018ff">
  <link rel="stylesheet" href="vendor/fonts/fragment-mono.css">
  <link rel="stylesheet" href="css/rcft.css?v=30">
  <link rel="stylesheet" href="css/ui.css?v=30">
</head>
<!--
  Pré-visualização do formulário no sistema da folha de mapa.
  data-home: para onde o formulário volta fora do Cargo (fecho e depois do envio).
-->
<body class="form" data-home="preview.html">
  <div id="stage" class="f-backdrop" aria-hidden="true"></div>
  <svg id="sheet" aria-hidden="true"></svg>

  <main class="f-wrap">
    <form id="rcft-form" class="f-sheet" novalidate>
      <header class="f-head">
        <h1 class="c-title">Contribute a response</h1>
        <a class="close" href="preview.html" aria-label="Back to the cartography">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 2 L14 14 M14 2 L2 14" stroke="currentColor" stroke-width="1.2" fill="none"/></svg>
        </a>
      </header>

      <p class="f-intro">You can reply in any language. Short or fragmentary answers are welcome.</p>

      <div class="f-row">
        <span class="f-n" aria-hidden="true">01</span>
        <label for="f-country">Where are you responding from?</label>
        <input id="f-country" name="country" type="text" maxlength="120" autocomplete="country-name" required>
      </div>
      <div class="f-row">
        <span class="f-n" aria-hidden="true">02</span>
        <label for="f-meaning">What does the word border mean to you?</label>
        <textarea id="f-meaning" name="meaning" maxlength="1000" rows="1" required></textarea>
      </div>
      <div class="f-row">
        <span class="f-n" aria-hidden="true">03</span>
        <label for="f-forms">What forms can a border take?</label>
        <textarea id="f-forms" name="forms" maxlength="1000" rows="1"></textarea>
      </div>
      <div class="f-row">
        <span class="f-n" aria-hidden="true">04</span>
        <label for="f-movement">Do borders change? What makes a border move?</label>
        <textarea id="f-movement" name="movement" maxlength="1000" rows="1"></textarea>
      </div>
      <div class="f-row">
        <span class="f-n" aria-hidden="true">05</span>
        <label for="f-space">Is there space between borders? What happens in that space?</label>
        <textarea id="f-space" name="space" maxlength="1000" rows="1"></textarea>
      </div>
      <div class="f-row">
        <span class="f-n" aria-hidden="true">06</span>
        <label for="f-oneword">If you had to choose one word related to border:</label>
        <input id="f-oneword" name="oneword" type="text" maxlength="60" autocomplete="off" required>
      </div>

      <button class="f-submit" type="submit">Submit</button>
      <p id="rcft-form-status" class="f-status" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script>window.RCFT_VERSION = 30;</script>
  <script src="js/config.js?v=30"></script>
  <script src="js/data.js?v=30"></script>
  <script src="vendor/p5-1.9.0.min.js"></script>
  <script src="js/ui.js?v=30"></script>
  <script src="js/contribute.js?v=30"></script>
  <script src="js/sketch.js?v=30"></script>
</body>
</html>
