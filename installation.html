<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Relational Cartography (rcft) - Installation</title>
  <meta name="robots" content="noindex">
  <style>html, body { margin: 0; background: rgb(0, 24, 255); }</style>
  <script>
    // A instalação abre install.html em modo instalação.
    // Outros parâmetros (por exemplo ?scale=1.5) passam para a frente.
    (function () {
      var q = new URLSearchParams(location.search);
      q.set("mode", "install");
      location.replace("install.html?" + q.toString());
    })();
  </script>
</head>
<body></body>
</html>
