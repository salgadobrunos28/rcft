<!doctype html>
<html lang="en" data-ui="sheet" data-mode="install" data-scale="auto" data-inspect="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Relational Cartography (rcft) - Installation</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0018ff">
  <link rel="stylesheet" href="vendor/fonts/fragment-mono.css">
  <link rel="stylesheet" href="css/rcft.css?v=38p">
  <link rel="stylesheet" href="css/ui.css?v=38p">
  <link rel="stylesheet" href="css/inspect.css?v=38p">
  <link rel="stylesheet" href="css/install.css?v=38p">
</head>
<!--
  PRÉ-VISUALIZAÇÃO: instalação com inspeção automática das palavras.
  Instalação (abre-se através de installation.html), no sistema da folha de mapa.
  Dois blocos nos cantos de baixo:
    à esquerda: a cartouche do site (título, totais e legenda), sem texto nem botão
    à direita:  últimas entradas, próxima entrada e QR
  Escala automática pelo lado menor do ecrã (data-scale="auto"; ?scale=1.5 fixa um valor).
-->
<body class="map">
  <div id="stage" aria-hidden="true"></div>
  <svg id="sheet" aria-hidden="true"></svg>

  <aside class="i-block cartouche" aria-label="Work">
    <div class="c-head">
      <h1 class="c-title">Relational Cartography</h1>
      <span class="c-meta">2026</span>
    </div>
    <ul class="c-stats" aria-label="Corpus">
      <li><span class="c-n" id="st-responses">--</span>responses</li>
      <li><span class="c-n" id="st-words">--</span>words</li>
      <li><span class="c-n" id="st-origins">--</span>origins</li>
      <li class="c-wide">last entry<span id="st-last">--</span></li>
    </ul>
    <ul class="c-legend" aria-label="Legend">
      <li><svg viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="4"/></svg>single response</li>
      <li><svg class="pulse" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="4"/></svg>repeated word</li>
      <li><svg viewBox="0 0 24 4" preserveAspectRatio="none" aria-hidden="true"><line x1="0" y1="2" x2="24" y2="2"/></svg>same country</li>
      <li><svg viewBox="0 0 24 4" preserveAspectRatio="none" aria-hidden="true"><line x1="0" y1="2" x2="24" y2="2" stroke-dasharray="5 3"/></svg>different country</li>
    </ul>
  </aside>

  <!-- Ficha de uma palavra: o sistema escolhe uma palavra de tempos a tempos. -->
  <aside id="w-card" class="w-card i-block" aria-live="polite" hidden>
    <div class="r-head w-head"><span class="w-word"></span><button class="w-close" type="button" aria-label="Close" hidden><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1 1L9 9M9 1L1 9"/></svg></button></div>
    <div class="w-body"></div>
  </aside>

  <aside class="i-block i-panel" aria-label="Entries">
    <section class="i-sec">
      <div class="r-row r-head"><span>Latest entries</span><span>x</span><span>y</span></div>
      <div id="coords" data-format="table" data-lines="5" data-mark-new></div>
    </section>
    <section class="i-sec q-next">
      <div class="r-row r-head"><span>Next entry</span><span>x</span><span>y</span></div>
      <div class="r-row"><span class="q-blank" aria-label="your word"></span><span id="qr-x">--</span><span id="qr-y">--</span></div>
    </section>
    <div id="qr" class="i-qr" hidden>
      <p class="q-cta">Scan to<br>add a word</p>
      <div id="qr-code"></div>
    </div>
  </aside>

  <pre id="debug" hidden></pre>

  <script>window.RCFT_VERSION = 38; window.RCFT_MODE = "install";</script>
  <script src="js/config.js?v=38p"></script>
  <script src="js/data.js?v=38p"></script>
  <script src="vendor/p5-1.9.0.min.js"></script>
  <script src="vendor/qrcode-generator-1.4.4.js"></script>
  <script src="js/ui.js?v=38p"></script>
  <script src="js/sketch.js?v=38p"></script>
</body>
</html>
