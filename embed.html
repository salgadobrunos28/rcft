<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Relational Cartography (rcft) - Preview</title>
  <meta name="robots" content="noindex">
  <!--
    Pré-visualização do site para encaixar noutra página (a página do projeto
    em salgadobrunos.com), num iframe 16:9. Carrega o próprio site (index.html)
    como num ecrã de 1280x720 e reduz tudo à largura disponível: é o site
    inteiro e ao vivo, em ponto pequeno, e continua a responder a cliques
    (palavras, texto, botão). O texto da cartouche começa fechado e abre ao
    clicar no título. ?w=1440 muda a largura de referência.
    Fora do ecrã, o site deixa de desenhar (js/sketch.js).
  -->
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: rgb(0, 24, 255); }
    #site { position: absolute; left: 0; top: 0; border: 0; transform-origin: 0 0; }
  </style>
</head>
<body>
  <iframe id="site" src="index.html?text=closed" title="Relational Cartography"></iframe>
  <script>
    (function () {
      var f = document.getElementById("site");
      var W = parseInt(new URLSearchParams(location.search).get("w"), 10) || 1280;
      var H = Math.round(W * 9 / 16);
      f.style.width = W + "px";
      f.style.height = H + "px";
      function fit() {
        var s = Math.min(innerWidth / W, innerHeight / H) || 1;
        f.style.transform = "translate(" + (innerWidth - W * s) / 2 + "px," + (innerHeight - H * s) / 2 + "px) scale(" + s + ")";
      }
      fit();
      addEventListener("resize", fit);
    })();
  </script>
</body>
</html>
